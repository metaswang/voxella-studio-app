<!doctype html><html lang="en"><head><meta charset="utf-8"><title>VoxStudio · UI Preview</title><style>body{margin:0;background:#e8e9ee;font:11px -apple-system,BlinkMacSystemFont,sans-serif;color:#596172}nav{display:flex;gap:7px;padding:10px 16px;align-items:center;flex-wrap:wrap;background:white;border-bottom:1px solid #ddd}nav button{border:1px solid #ddd;background:white;border-radius:5px;padding:5px 9px;font:inherit;cursor:pointer}nav button[aria-pressed=true]{background:#eef0ff;border-color:#bbc2f3;color:#4254c5}#status{margin-right:auto;font-size:10px}#calls{display:block;padding:7px 16px;background:#f3f4f7;font-size:10px}iframe{display:block;width:min(1040px,100%);height:calc(100vh - 82px);border:0;margin:auto;background:#fafaf9;transition:width .2s}iframe.narrow{width:390px;max-width:100%}</style></head><body><nav><span id="status">Connecting to local VoxStudio…</span><button data-panel="library">Sessions</button><button data-panel="transcription">Transcribe</button><button data-panel="session">Session detail</button><button data-panel="dubbing">Voiceover</button><button id="theme">Light / dark</button><button id="width">Wide / narrow</button><label><input type="checkbox" id="conflict">Save conflict</label><label><input type="checkbox" id="empty">Empty state</label></nav><output id="calls">Local MCP preview · real app data by default</output><iframe id="panel" title="VoxStudio panel"></iframe><script type="module" src="/host.js"></script></body></html>
